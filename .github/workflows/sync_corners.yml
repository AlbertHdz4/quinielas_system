name: Sincronizar corners, amarillas y penales del Mundial

on:
  schedule:
    # Cada 30 min, en :15 y :45 (offset del sync de resultados que corre en :03/:18/:33/:48).
    # Los stats solo se llenan tras el partido. La API de ESPN es gratis y sin llave.
    - cron: '15,45 * * * *'
  # Permite dispararlo manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  sync-corners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Sincronizar corners, amarillas y penales
        run: python update_corners.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
