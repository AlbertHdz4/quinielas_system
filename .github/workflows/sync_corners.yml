name: Sincronizar tiros de esquina del Mundial

on:
  schedule:
    # Cada 30 min, en :15 y :45 (offset del sync de resultados que corre en :03/:18/:33/:48).
    # Los corners solo se llenan tras el partido; el plan Free de API-Football da 100 req/día
    # y este ritmo (≈48 llamadas base/día + estadísticas) queda holgado en eliminatorias.
    - cron: '15,45 * * * *'
  # Permite dispararlo manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  sync-corners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Sincronizar tiros de esquina
        run: python update_corners.py
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
